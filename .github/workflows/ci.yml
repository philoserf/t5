name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The pre-commit gate (Taskfile.yml `check`): formatting, vet, tests. The
      # gofmt step fails on drift, where the local `gofmt -l` only lists files.
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "These files are not gofmt-clean:"
            echo "$drift"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...
