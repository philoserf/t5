name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The pre-commit gate (Taskfile.yml `check`): golangci-lint subsumes
      # formatting (gofumpt/goimports/golines drift is reported) and vet (the
      # govet linter), so the lint step replaces the former gofmt + vet steps.
      - name: lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2

      - name: test
        run: go test ./...
